name: Vox
options:
  bundleIdPrefix: com.andykim
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
targets:
  # ─── macOS Menu Bar App (existing) ───
  Vox:
    type: application
    platform: macOS
    sources:
      - path: Vox
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andykim.vox
        CODE_SIGN_ENTITLEMENTS: Vox/Vox.entitlements
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 2LARJ8Z62D
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Vox/Resources/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies:
      - package: WhisperKit
      - package: KeyboardShortcuts
    scheme:
      gatherCoverageData: false
      testTargets: []

  # ─── iOS Container App ───
  VoxiOS:
    type: application
    platform: iOS
    sources:
      - path: VoxiOS
        excludes:
          - Resources/Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andykim.vox.ios
        CODE_SIGN_ENTITLEMENTS: VoxiOS/VoxiOS.entitlements
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 2LARJ8Z62D
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: VoxiOS/Resources/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: WhisperKit
      - target: VoxKeyboard
    scheme:
      gatherCoverageData: false
      testTargets: []

  # ─── iOS Custom Keyboard Extension ───
  VoxKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: VoxKeyboard
        excludes:
          - Resource/Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andykim.vox.ios.keyboard
        CODE_SIGN_ENTITLEMENTS: VoxKeyboard/VoxKeyboard.entitlements
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 2LARJ8Z62D
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: VoxKeyboard/Resource/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: WhisperKit
